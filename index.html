<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
    <title>J-Eco</title>
</head>
<body>

<div class="slide_bar">
    <h1>J-Eco</h1>


    <h3>Statistic</h3>
    <div class="card balance">
        <p>Balance: </p>
        <p>Your Eco-level: </p>
        <p>Pollution: </p>
    </div>


    <h3>Shop</h3>
    <div class="shop_grid">
        <div class="card shopping">
            <img src="bag.jpeg" class="icon_card">
            <p>Reusable shopper</p>
            <span>1200 dinars</span>
        </div>

        <div class="card shopping">
            <img src="cup.jpeg" class="icon_card">
            <p>Paper cup</p>
            <span>180 dinars</span>
        </div>

        <div class="card shopping">
            <img src="pen.jpeg" class="icon_card">
            <p>Paper pen</p>
            <span>120 dinars</span>
        </div>

        <div class="card shopping">
            <img src="napkin.jpeg" class="icon_card">
            <p>Reusable napkin</p>
            <span>1300 dinars</span>
        </div>

        <div class="card shopping">
            <img src="bottle.jpeg" class="icon_card">
            <p>Reusable water bottle</p>
            <span>450 dinars</span>
        </div>

        <div class="card shopping">
            <img src="toothbrush.jpeg" class="icon_card">
            <p>Bamboo Toothbrush</p>
            <span>350 dinars</span>
        </div>
    </div>

    <h3>Control menu</h3>
    <div class="shop_grid">
        <div class="card turn_off_light shopping">
            <img src="theme_site.jpg" class="icon_card">
            <span>Dark Mode</span>
        </div>


        <div class="card turn_off_soind shopping">
            <img src="zvuk_image.jpg" class="icon_card">
            <span>Turn off sound</span>
        </div>
    </div>

    <div class="footer">
        <hr class="hr">
        <p>Plat Ilich</p>
    </div>


</div>


<div class="main">

</div>

</body>
</html>
